<!doctype html>
<html lang="en" data-contrast="standard" data-font="inter">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MindFlow</title>
<meta name="description" content="MindFlow: calm, one-step-at-a-time recipes for ADHD and executive function.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--color-background-primary:#F8F7F2;--color-background-secondary:#EEF1E8;--color-background-inverse:#293329;--color-surface-default:#FFFFFF;--color-surface-subtle:#E7EBDD;--color-surface-selected:#E4EADB;--color-surface-completed:#EEF1E8;--color-surface-disabled:#E7EBDD;--color-brand-primary:#506447;--color-brand-primaryHover:#3E5036;--color-brand-primaryPressed:#2F3E2A;--color-brand-accent:#65785B;--color-brand-secondary:#C8D2BC;--color-brand-onPrimary:#FFFFFF;--color-text-primary:#293329;--color-text-secondary:#4F594D;--color-text-muted:#626B60;--color-text-disabled:#767D72;--color-text-onInverse:#F8F7F2;--color-text-link:#2C5F6B;--color-border-default:#D9DED2;--color-border-strong:#8A9484;--color-border-selected:#506447;--color-feedback-success:#426B4A;--color-feedback-successSurface:#DCEADD;--color-feedback-warning:#98652E;--color-feedback-warningSurface:#F8E9D2;--color-feedback-error:#A3443D;--color-feedback-errorSurface:#F5DEDB;--color-feedback-info:#426B78;--color-feedback-infoSurface:#DCE9ED;--color-feedback-warningText:#6F4519;--color-focus-ring:#355D43;--color-focus-halo:#FFFFFF;--color-state-hover:#EEF1E8;--color-state-pressed:#E4EADB;--color-state-disabled:#E7EBDD;--color-state-selected:#E4EADB;--color-state-completed:#EEF1E8;--color-timer-running:#2C5F6B;--color-timer-runningSurface:#D8EAEE;--color-timer-paused:#4F594D;--color-timer-pausedSurface:#E7EBDD;--color-timer-expired:#98652E;--color-timer-expiredSurface:#F8E9D2;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-10:40px;--space-12:48px;--space-16:64px;--space-20:80px;--radius-none:0px;--radius-small:8px;--radius-medium:12px;--radius-large:20px;--radius-pill:999px;--shadow-none:none;--shadow-low:0 1px 2px rgba(41,51,41,0.06), 0 1px 1px rgba(41,51,41,0.04);--shadow-medium:0 4px 12px rgba(41,51,41,0.08), 0 1px 3px rgba(41,51,41,0.06);--shadow-high:0 12px 32px rgba(41,51,41,0.14), 0 2px 6px rgba(41,51,41,0.08);--shadow-dock:0 -4px 20px rgba(41,51,41,0.10)}
html[data-contrast=high]{--color-background-primary:#FFFFFF;--color-background-secondary:#F2F2F2;--color-surface-default:#FFFFFF;--color-surface-subtle:#EDEDED;--color-brand-primary:#1F3A1A;--color-brand-primaryHover:#142610;--color-text-primary:#000000;--color-text-secondary:#1A1A1A;--color-text-muted:#333333;--color-border-default:#4A4A4A;--color-focus-ring:#0B3D91;--color-timer-running:#0B3D5C;--color-timer-expired:#6B3F00;--color-border-strong:#4A4A4A}
:root{
  --bg:var(--color-background-primary);--bg2:var(--color-background-secondary);
  --surface:var(--color-surface-default);--subtle:var(--color-surface-subtle);
  --brand:var(--color-brand-primary);--brand-h:var(--color-brand-primaryHover);--brand-p:var(--color-brand-primaryPressed);
  --on-brand:var(--color-brand-onPrimary);--brand2:var(--color-brand-secondary);
  --text:var(--color-text-primary);--text2:var(--color-text-secondary);--muted:var(--color-text-muted);--dis:var(--color-text-disabled);
  --border:var(--color-border-default);--border-s:var(--color-border-strong);
  --focus:var(--color-focus-ring);
  --hover:var(--color-state-hover);--press:var(--color-state-pressed);--sel:var(--color-state-selected);--done:var(--color-state-completed);
  --font-inter:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-acc:'Atkinson Hyperlegible',Inter,system-ui,sans-serif;
  --gutter:16px;--bar-h:0px;--dock-bottom:16px;
  --r-s:var(--radius-small);--r-m:var(--radius-medium);--r-l:var(--radius-large);
}
@media (min-width:600px){:root{--gutter:24px}}
@media (min-width:1025px){:root{--gutter:32px}}
*{box-sizing:border-box}
html{font-size:100%;-webkit-text-size-adjust:100%;scroll-padding-top:16px}
html[data-size=large]{font-size:112.5%}
html[data-size=xl]{font-size:125%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-inter);font-size:1rem;line-height:1.6;min-height:100vh;display:flex;flex-direction:column}
html[data-font=atkinson] body{font-family:var(--font-acc)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
a{color:var(--color-text-link)}
img,svg{max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-100px;background:var(--surface);padding:12px 16px;border-radius:var(--r-s);z-index:100;border:2px solid var(--brand)}
.skip:focus{top:8px}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px #fff}
[tabindex="-1"]:focus{outline:none;box-shadow:none}
.ic{width:24px;height:24px;flex:none}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding:0 var(--gutter)}
#app{flex:1;display:flex;flex-direction:column;min-width:0}
main{flex:1;padding-bottom:calc(var(--bar-h) + 96px)}
.display{font-size:clamp(2.5rem,5vw,3rem);line-height:1.15;font-weight:700;letter-spacing:-.02em}
.h1{font-size:2rem;line-height:1.25;font-weight:600}
.h2{font-size:1.5rem;line-height:1.3;font-weight:600}
.h3{font-size:1.25rem;line-height:1.4;font-weight:600}
.lead{font-size:1.125rem;color:var(--text2);max-width:65ch}
.support{font-size:.875rem;font-weight:500;color:var(--text2)}
.label{font-size:.8125rem;font-weight:500;letter-spacing:.01em;color:var(--text2)}
.eyebrow{font-size:.8125rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text2)}
.stack>*+*{margin-top:var(--space-4)}
.stack-lg>*+*{margin-top:var(--space-8)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;min-width:48px;padding:0 24px;border-radius:var(--r-m);border:2px solid transparent;font-size:1.0625rem;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center;transition:background-color .12s,border-color .12s}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover,.btn-primary.is-hover{background:var(--brand-h)}
.btn-primary:active,.btn-primary.is-pressed{background:var(--brand-p)}
.btn-secondary{background:var(--surface);color:var(--brand);border-color:var(--brand)}
.btn-secondary:hover,.btn-secondary.is-hover{background:var(--hover)}
.btn-secondary:active,.btn-secondary.is-pressed{background:var(--press)}
.btn-quiet{background:transparent;color:var(--text);padding:0 16px;min-height:48px}
.btn-quiet:hover{background:var(--hover)}
.btn-icon{padding:0;width:48px;height:48px;min-height:48px}
.btn:disabled,.btn[aria-disabled=true]{background:var(--color-surface-disabled);color:var(--dis);border-color:transparent;cursor:not-allowed}
.btn.is-focus{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px #fff}
.btn.is-loading{position:relative}
.dots{display:inline-flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.btn-block{width:100%}

/* ---------- header ---------- */
.site-header{background:var(--bg);border-bottom:1px solid var(--border)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:16px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:1.25rem;min-height:48px}
.logo svg{width:32px;height:32px}
.nav-desktop{display:none;gap:8px;align-items:center}
.navlink{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-radius:var(--r-m);text-decoration:none;color:var(--text);font-weight:500}
.navlink:hover{background:var(--hover)}
.navlink[aria-current=page]{background:var(--sel);font-weight:600;box-shadow:inset 0 -3px 0 var(--brand)}
.menu-btn{display:inline-flex}
.mobile-menu{border-top:1px solid var(--border);background:var(--surface)}
.mobile-menu .wrap{display:grid;gap:4px;padding-top:8px;padding-bottom:12px;min-height:0}
.mobile-menu .navlink{min-height:56px;font-size:1.0625rem}
@media (min-width:600px){.nav-desktop{display:flex}.menu-btn,.mobile-menu{display:none!important}}

/* ---------- search & chips ---------- */
.hero{padding:40px 0 24px}
.hero .lead{margin-top:12px}
.search{display:flex;gap:8px;margin-top:24px;max-width:720px}
.search .field{position:relative;flex:1}
.search .field .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none}
.search input{width:100%;height:56px;padding:0 16px 0 52px;border-radius:var(--r-m);border:2px solid var(--border-s);background:var(--surface);font-size:1.125rem}
.search input::placeholder{color:var(--muted);opacity:1}
.search .btn-icon{width:56px;height:56px;border:2px solid var(--border-s);background:var(--surface);color:var(--text)}
.search .btn-icon:hover{background:var(--hover)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--border-s);background:var(--surface);cursor:pointer;font-weight:500}
.chip .ic{width:18px;height:18px;display:none}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:var(--sel);border-color:var(--brand);font-weight:600}
.chip[aria-pressed=true] .ic{display:block}
.voice-status{min-height:24px;margin-top:8px}

/* ---------- cards ---------- */
.continue{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:2px solid var(--brand);border-radius:var(--r-m);padding:16px;margin-top:24px}
.continue .meta{display:grid;gap:8px;flex:1}
@media (min-width:600px){.continue{flex-direction:row;align-items:center}}
.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-low);transition:box-shadow .2s}
.rcard:hover,.rcard.is-hover{box-shadow:var(--shadow-medium)}
.rcard:has(a:focus-visible),.rcard.is-focus{outline:3px solid var(--focus);outline-offset:2px}
.rcard a:focus-visible{outline:none;box-shadow:none}
.rcard .thumb svg{display:block;width:100%;height:auto}
.rcard .body{padding:16px;display:grid;gap:8px;flex:1}
.rcard h3 a{color:var(--text);text-decoration:none}
.rcard h3 a::after{content:'';position:absolute;inset:0}
.rcard .save{position:absolute;top:8px;right:8px;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:48px;min-width:48px;padding:0 12px;border-radius:var(--r-m);border:2px solid var(--border-s);background:var(--surface);cursor:pointer;font-weight:600;font-size:.875rem;justify-content:center}
.rcard .save:hover{background:var(--hover)}
.rcard .save[aria-pressed=true]{border-color:var(--brand);background:var(--sel)}
.rcard .save .ic{width:20px;height:20px}
.rcard.is-continue{border:2px solid var(--brand)}
.facts-row{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--text2);font-size:.875rem;font-weight:500}
.facts-row span{display:inline-flex;align-items:center;gap:6px}
.facts-row .ic{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--border-s);font-size:.8125rem;font-weight:600;color:var(--text)}
.pill .ic{width:16px;height:16px}
.featured{display:grid;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;position:relative;margin-top:40px}
.featured .thumb svg{display:block;width:100%;height:100%;object-fit:cover}
.featured .body{padding:24px;display:grid;gap:12px;align-content:center}
.featured h2 a{color:var(--text);text-decoration:none}
.featured h2 a::after{content:'';position:absolute;inset:0}
.featured:has(a:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.featured a:focus-visible{outline:none;box-shadow:none}
@media (min-width:600px){.featured{grid-template-columns:1fr 1fr}.featured .body{padding:32px}}
.section{margin-top:48px}
.section>.h2{margin-bottom:16px}
.empty{background:var(--surface);border:2px dashed var(--border-s);border-radius:var(--r-m);padding:32px 24px;text-align:center;display:grid;gap:12px;justify-items:center}

/* ---------- recipe overview ---------- */
.crumb{padding:16px 0 0}
.split{display:grid;gap:32px;padding-top:16px}
@media (min-width:1025px){.split{grid-template-columns:5fr 6fr;gap:48px;align-items:start}.split .summary{position:sticky;top:16px}}
@media (min-width:600px) and (max-width:1024px){.split .summary .hero-img{max-width:640px}}
.hero-img{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--border)}
.hero-img svg{display:block;width:100%;height:auto}
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m)}
@media (min-width:600px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts dt{font-size:.8125rem;font-weight:500;color:var(--text2)}
.facts dd{margin:0;font-size:1.25rem;font-weight:600}
.ctas{display:grid;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}
.controls .grp{display:grid;gap:6px}
.seg{display:inline-flex;border:2px solid var(--border-s);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.seg button{min-height:48px;min-width:56px;padding:0 16px;border:0;background:transparent;cursor:pointer;font-weight:500;border-right:2px solid var(--border-s)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:600}
.seg button:focus-visible{outline-offset:-3px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);cursor:pointer;position:relative}
.row input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.row .box{width:28px;height:28px;border:2px solid var(--border-s);border-radius:var(--r-s);display:grid;place-items:center;flex:none;background:var(--surface)}
.row .box .ic{width:20px;height:20px;color:var(--on-brand);opacity:0}
.row:hover,.row.is-hover{background:var(--hover)}
.row:has(input:focus-visible),.row.is-focus{outline:3px solid var(--focus);outline-offset:2px}
.row input:focus-visible{outline:none}
.row:has(input:checked) .box,.row.is-checked .box{background:var(--brand);border-color:var(--brand)}
.row:has(input:checked) .box .ic,.row.is-checked .box .ic{opacity:1}
.row:has(input:checked),.row.is-checked{background:var(--done)}
.row:has(input:checked) .name,.row.is-checked .name{text-decoration:line-through;color:var(--text2)}
.row .qty{font-weight:600;min-width:5.5ch;font-variant-numeric:tabular-nums}
.row .eq{color:var(--text2)}
.row .eq .ic{width:24px;height:24px}
.row .state{margin-left:auto;font-size:.8125rem;font-weight:600;color:var(--text2);display:none;align-items:center;gap:4px}
.row:has(input:checked) .state,.row.is-checked .state{display:inline-flex}
.row .state .ic{width:16px;height:16px}
details.ready{margin-top:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-m)}
details.ready>summary{min-height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;cursor:pointer;font-weight:600;list-style:none}
details.ready>summary::-webkit-details-marker{display:none}
details.ready>summary::after{content:'+';margin-left:auto;font-size:1.5rem;font-weight:500}
details.ready[open]>summary::after{content:'\2212'}
details.ready .checklist{padding:0 12px 12px}
details.disclose{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m)}
details.disclose>summary{min-height:56px;display:flex;align-items:center;padding:0 16px;cursor:pointer;font-weight:600;list-style:none;gap:8px}
details.disclose>summary::-webkit-details-marker{display:none}
details.disclose>summary::after{content:'+';margin-left:auto;font-size:1.5rem;font-weight:500}
details.disclose[open]>summary::after{content:'\2212'}
details.disclose>.in{padding:0 16px 16px}
details.disclose ol{margin:0;padding-left:24px;display:grid;gap:12px;max-width:65ch}

/* ---------- switch ---------- */
.switch{display:inline-flex;align-items:center;gap:12px;min-height:48px;background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.switch .track{width:56px;height:32px;border-radius:999px;background:var(--border-s);position:relative;flex:none;transition:background-color .12s;border:2px solid var(--border-s)}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .12s;box-shadow:var(--shadow-low)}
.switch[aria-checked=true] .track{background:var(--brand);border-color:var(--brand)}
.switch[aria-checked=true] .track::after{transform:translateX(24px)}
.switch .txt{min-width:2.5ch}
.switch:disabled{cursor:not-allowed;color:var(--dis)}
.switch:disabled .track{background:var(--color-surface-disabled);border-color:var(--border)}
.switch.is-focus{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px #fff;border-radius:var(--r-s)}
.switch-row{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:12px 16px}

/* ---------- progress ---------- */
.progress{display:grid;gap:8px}
.progress .bar{height:12px;background:var(--subtle);border-radius:999px;overflow:hidden;border:1px solid var(--border-s)}
.progress .bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .2s}
.progress.is-complete .bar>i{background:var(--color-feedback-success)}
.progress .cap{display:flex;justify-content:space-between;font-weight:600;font-size:.9375rem;align-items:center;gap:8px}
.progress .cap .ic{width:18px;height:18px}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:12px;border-radius:999px;background:var(--subtle);border:1px solid var(--border-s)}
.segs i.d{background:var(--brand);border-color:var(--brand)}
.segs i.c{background:var(--surface);border:3px solid var(--brand)}

/* ---------- prep ---------- */
.narrow{max-width:720px;margin:0 auto}
.prep-head{padding:32px 0 16px}
.cols{display:grid;gap:32px}
@media (min-width:1025px){.cols.two{grid-template-columns:1fr 1fr}}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 75%,transparent);padding:16px 0 calc(16px + env(safe-area-inset-bottom));margin-top:32px;display:grid;gap:12px;z-index:5}

/* ---------- cook ---------- */
body.cooking{--bar-h:81px}
.focus-head{background:var(--bg);border-bottom:1px solid var(--border)}
.focus-head .wrap{display:flex;align-items:center;gap:8px;min-height:64px}
.focus-head .t{flex:1;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-layout{display:grid;gap:24px;padding-top:24px}
@media (min-width:600px){.cook-layout{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
@media (min-width:1025px){.cook-layout{grid-template-columns:minmax(0,1fr) 340px;gap:32px}}
.stepcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-m);padding:24px;display:grid;gap:20px;box-shadow:var(--shadow-medium)}
@media (min-width:600px){.stepcard{padding:40px}}
.stepcard.is-done{background:var(--done)}
.stepcard .step-title{font-size:1rem;font-weight:700;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.instruction{font-size:clamp(1.25rem,2.2vw,1.625rem);line-height:1.6;font-weight:500;max-width:65ch}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:999px;font-size:.8125rem;font-weight:700;letter-spacing:.02em;text-transform:none;background:var(--color-feedback-successSurface);color:var(--color-feedback-success);border:1px solid var(--color-feedback-success)}
.badge .ic{width:16px;height:16px}
.note{display:flex;gap:12px;padding:16px;border-radius:var(--r-m);border:2px solid}
.note.warn{background:var(--color-feedback-warningSurface);border-color:var(--color-feedback-warning);color:var(--color-feedback-warningText)}
.note.info{background:var(--color-feedback-infoSurface);border-color:var(--color-feedback-info);color:#25434d}
.note .ic{margin-top:2px}
.note strong{display:block}
.side{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:16px;display:grid;gap:12px}
.panel h2{font-size:1rem;font-weight:700;display:flex;gap:8px;align-items:center}
.panel ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.panel li{display:flex;gap:10px;align-items:center}
.panel li .q{font-weight:600;min-width:6ch;font-variant-numeric:tabular-nums}
.panel li .ic{width:22px;height:22px;color:var(--text2)}
.panel .none{color:var(--text2);font-size:.9375rem}
.actionbar{position:sticky;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--border);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}
.actionbar .wrap{display:flex;gap:12px}
.actionbar .btn{flex:1}
.actionbar .btn-primary{flex:2}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--color-feedback-infoSurface);border:2px solid var(--color-feedback-info);border-radius:var(--r-m);padding:12px 16px;color:#25434d}
.banner p{flex:1;min-width:200px;font-weight:500}

/* ---------- timers ---------- */
.timer{--tc:var(--color-timer-running);--ts:var(--color-timer-runningSurface);border:2px solid var(--tc);background:var(--ts);border-radius:var(--r-m);padding:16px;display:grid;gap:12px;color:var(--text)}
.timer[data-state=paused]{--tc:var(--color-timer-paused);--ts:var(--color-timer-pausedSurface)}
.timer[data-state=done]{--tc:var(--color-timer-expired);--ts:var(--color-timer-expiredSurface);color:var(--color-feedback-warningText)}
.timer[data-state=dismissed]{--tc:var(--border-s);--ts:var(--surface)}
.timer .status{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--tc);font-size:.9375rem}
.timer[data-state=done] .status{color:var(--color-feedback-warningText)}
.timer .digits{font-size:2.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.timer[data-state=done] .digits{color:var(--color-feedback-warningText)}
.timer .tlabel{font-weight:500;color:var(--text2)}
.timer[data-state=done] .tlabel{color:var(--color-feedback-warningText)}
.timer .tctl{display:flex;gap:8px;flex-wrap:wrap}
.timer .tctl .btn{flex:1;min-width:120px}
.timer[data-state=done]{animation:soft 1.6s ease-in-out 3}
@keyframes soft{50%{box-shadow:0 0 0 6px rgba(152,101,46,.28)}}
.timer-idle{width:100%}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-bottom) + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));z-index:40;display:grid;gap:8px;max-height:45vh;overflow:auto}
@media (min-width:1025px){.dock{left:auto;right:24px;transform:none;width:380px}}
.dock[hidden]{display:none}
.dock .dockitem{display:flex;align-items:center;gap:8px;background:var(--ts);border:2px solid var(--tc);border-radius:var(--r-m);padding:8px 8px 8px 16px;box-shadow:var(--shadow-high);--tc:var(--color-timer-running);--ts:var(--surface);color:var(--text)}
.dock .dockitem[data-state=paused]{--tc:var(--color-timer-paused)}
.dock .dockitem[data-state=done]{--tc:var(--color-timer-expired);--ts:var(--color-timer-expiredSurface);color:var(--color-feedback-warningText)}
.dock .dockitem .info{flex:1;min-width:0;display:grid}
.dock .dockitem .where{font-size:.8125rem;font-weight:600;display:flex;gap:6px;align-items:center;color:var(--tc)}
.dock .dockitem[data-state=done] .where{color:var(--color-feedback-warningText)}
.dock .dockitem .where .ic{width:16px;height:16px}
.dock .dockitem .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:inherit;text-decoration:none}
.dock .dockitem .nm:hover{text-decoration:underline}
.dock .dockitem .d{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.dock .dockitem .btn{min-height:48px;padding:0 14px;font-size:.9375rem}
.dock.pulse .dockitem[data-state=done]{animation:soft 1.6s ease-in-out 3}
.demo-row{display:grid;gap:16px}
@media (min-width:600px){.demo-row{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1025px){.demo-row{grid-template-columns:repeat(4,1fr)}}

/* ---------- complete ---------- */
.done-wrap{text-align:center;display:grid;gap:24px;justify-items:center;padding:40px 0}
.done-wrap .art{width:min(320px,80%)}
.done-wrap .art svg{width:100%;height:auto}
.summary-list{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:center;color:var(--text2);font-weight:500}
.summary-list span{display:inline-flex;gap:8px;align-items:center}
.done-actions{display:grid;gap:12px;width:100%;max-width:420px}
.fb{display:grid;gap:8px;justify-items:center}

/* ---------- settings ---------- */
.set-group{display:grid;gap:12px}
.setting{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:16px;display:grid;gap:12px}
.setting .head{display:flex;gap:12px;align-items:flex-start}
.setting .head .ic{color:var(--text2);margin-top:2px}
.setting .head p{color:var(--text2);font-size:.9375rem}
.setting .head strong{display:block;font-size:1.0625rem}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:var(--r-m);padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--text);box-shadow:var(--shadow-high)}
dialog::backdrop{background:rgba(41,51,41,.55)}
dialog .dlg{padding:24px;display:grid;gap:16px}
dialog .dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
dialog ol button{width:100%;text-align:left;display:flex;gap:12px;align-items:flex-start;min-height:56px;padding:12px 16px;border-radius:var(--r-m);border:2px solid var(--border);background:var(--surface);cursor:pointer}
dialog ol button:hover{background:var(--hover)}
dialog ol button[aria-current=step]{border-color:var(--brand);background:var(--sel)}
dialog ol .n{font-weight:700;min-width:2ch}
dialog ol .st{display:block;font-size:.8125rem;font-weight:700;color:var(--text2)}
.quote{background:var(--bg2);border-radius:var(--r-m);padding:16px;font-size:1.125rem;font-weight:500}

/* ---------- system ---------- */
.sw-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.sw{border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.sw i{display:block;height:56px;border-bottom:1px solid var(--border)}
.sw div{padding:8px 12px;font-size:.8125rem;word-break:break-word}
.sw b{display:block;font-size:.8125rem}
.spec{display:grid;gap:12px;align-items:start}
.spec-row{display:grid;gap:12px}
@media (min-width:600px){.spec-row.c2{grid-template-columns:repeat(2,1fr)}.spec-row.c3{grid-template-columns:repeat(3,1fr)}}
.sbar{display:flex;align-items:center;gap:12px;font-size:.875rem}
.sbar i{display:block;height:16px;background:var(--brand2);border-radius:2px}
footer.site-footer{border-top:1px solid var(--border);padding:24px 0 calc(var(--bar-h) + 24px);color:var(--text2);font-size:.875rem;margin-top:48px}
footer.site-footer .wrap{display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}

/* ---------- Clean View & motion ---------- */
body.clean .decor{display:none!important}
body.clean .rcard .body{padding-top:64px}
body.clean .rcard .save{top:8px}
.rm *,.rm *::before,.rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
html[data-contrast=high] .rcard,html[data-contrast=high] .row,html[data-contrast=high] .panel,html[data-contrast=high] .setting{border-width:2px}
</style>
</head>

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtNum(n,den=8){const r=Math.round(n*den-0.001)/den;const w=Math.floor(r+1e-9);const f=Math.round((r-w)*8);const FR=['','⅛','¼','⅜','½','⅝','¾','⅞'];if(!w&&!f)return '0';return w&&f?`${w} ${FR[f]}`:w?`${w}`:FR[f]}
function qtyText(i,scale,units){
  let v=i.q*scale,u=i.u;
  if(u==='g'){ if(units==='imperial'){const oz=v/28.35;return oz>=16?`${fmtNum(oz/16,4)} lb`:`${fmtNum(oz,4)} oz`} return `${v>=100?Math.round(v/5)*5:Math.round(v)} g`}
  if(u==='ml'){ if(units==='imperial'){ if(v>=180)return `${fmtNum(v/240,4)} ${v/240>1.1?'cups':'cup'}`; return `${fmtNum(v/29.57,4)} fl oz`} return `${v>=100?Math.round(v/5)*5:Math.round(v)} ml`}
  if(u==='count')return fmtNum(v);
  return `${fmtNum(v)} ${u}`;
}
const scaleOf=id=>S.scale[id]||1;
const chk=id=>(S.checked[id]=S.checked[id]||{});
function tfmt(s){s=Math.max(0,Math.ceil(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;const p=n=>String(n).padStart(2,'0');return h?`${h}:${p(m)}:${p(x)}`:`${p(m)}:${p(x)}`}
function tword(secs){return secs%60===0?`${secs/60} min`:`${secs} sec`}

/* ================= timers ================= */
function tStart(rid,step,label,secs){const id=rid+':'+step;S.timers[id]={id,rid,step,label,total:secs,state:'running',endsAt:Date.now()+secs*1000,remaining:secs};save()}
function tAct(act,id){
  const t=S.timers[id];if(!t)return;const now=Date.now();
  if(act==='tPause'&&t.state==='running'){t.remaining=Math.max(0,Math.ceil((t.endsAt-now)/1000));t.state='paused'}
  else if(act==='tResume'&&t.state==='paused'){t.endsAt=now+t.remaining*1000;t.state='running'}
  else if(act==='tReset'){delete S.timers[id]}
  else if(act==='tDismiss'){t.state='dismissed'}
  save();renderDock();refreshTimerViews();
}
function liveRemaining(t){return t.state==='running'?Math.max(0,Math.ceil((t.endsAt-Date.now())/1000)):t.state==='paused'?t.remaining:0}
function timerLabel(t){return t.rid==='demo'?t.label:`Step ${Number(t.step)+1} · ${t.label}`}
function timerCard(t,opts={}){
  const st=t.state, lbl={running:'Running',paused:'Paused',done:"Time's up",dismissed:'Finished'}[st], icon={running:'clock',paused:'pause',done:'bell',dismissed:'check'}[st];
  let ctl='';
  if(st==='running')ctl=`<button class="btn btn-secondary" data-act="tPause" data-tid="${t.id}">${ic('pause')} Pause</button>`;
  if(st==='paused')ctl=`<button class="btn btn-primary" data-act="tResume" data-tid="${t.id}">${ic('play')} Resume</button><button class="btn btn-secondary" data-act="tReset" data-tid="${t.id}">${ic('reset')} Reset</button>`;
  if(st==='done')ctl=`<button class="btn btn-primary" data-act="tDismiss" data-tid="${t.id}">${ic('check')} Dismiss</button>`;
  if(st==='dismissed')ctl=`<button class="btn btn-secondary" data-act="tReset" data-tid="${t.id}">${ic('reset')} Start again</button>`;
  const digits=st==='done'?`<div class="digits" aria-hidden="true">00:00</div>`:st==='dismissed'?'':`<div class="digits" role="timer" data-timer-time="${t.id}" aria-label="${esc(t.label)}, time left">${tfmt(liveRemaining(t))}</div>`;
  return `<div class="timer" data-state="${st}"><div class="status">${ic(icon)}<span>${st==='done'?`Time's up: ${esc(t.label)}`:lbl}</span></div>${digits}<div class="tlabel">${esc(timerLabel(t))}${st==='paused'?' · paused':''}</div><div class="tctl">${ctl}</div></div>`;
}
function idleTimer(rid,step,label,secs){return `<button class="btn btn-secondary timer-idle" data-act="tStart" data-rid="${rid}" data-step="${step}" data-label="${esc(label)}" data-secs="${secs}">${ic('clock')} Start ${tword(secs)} timer</button>`}
function renderDock(){
  const d=$('#dock');const list=Object.values(S.timers).filter(t=>t.state!=='dismissed');
  if(!list.length){d.hidden=true;d.innerHTML='';return}
  d.hidden=false;
  list.sort((a,b)=>(a.state==='done'?-1:0)-(b.state==='done'?-1:0));
  d.innerHTML=list.map(t=>{
    const st=t.state, ico={running:'clock',paused:'pause',done:'bell'}[st], word={running:'Running',paused:'Paused',done:"Time's up"}[st];
    const name=esc(timerLabel(t));
    const nm=t.rid==='demo'?`<span class="nm">${name}</span>`:`<a class="nm" href="#/cook/${t.rid}" aria-label="${name}, go to this recipe">${name}</a>`;
    let ctl=st==='running'?`<button class="btn btn-secondary btn-icon" data-act="tPause" data-tid="${t.id}" aria-label="Pause ${name}">${ic('pause')}</button>`
      :st==='paused'?`<button class="btn btn-primary btn-icon" data-act="tResume" data-tid="${t.id}" aria-label="Resume ${name}">${ic('play')}</button>`
      :`<button class="btn btn-primary" data-act="tDismiss" data-tid="${t.id}" aria-label="Dismiss ${name}">Dismiss</button>`;
    return `<div class="dockitem" data-state="${st}"><div class="info"><span class="where">${ic(ico)} ${word}</span>${nm}<span class="d" data-timer-time="${t.id}" ${st==='done'?'aria-hidden="true"':''}>${st==='done'?'00:00':tfmt(liveRemaining(t))}</span></div>${ctl}</div>`}).join('');
}
function refreshTimerViews(){const {page}=parse();if(['cook','timers'].includes(page))render({keepScroll:true})}
function fireAlert(t){
  const msg=`Timer finished: ${timerLabel(t)}.`;
  const al=$('#alerts');al.textContent='';setTimeout(()=>al.textContent=msg,30);
  if(S.prefs.sound)beep();
  if(S.prefs.vibrate&&canVibrate())try{navigator.vibrate([250,120,250,120,250])}catch(e){}
  const d=$('#dock');d.classList.toggle('pulse',!!S.prefs.visual);
}
let actx=null;
function beep(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const now=actx.currentTime;[0,.35,.7].forEach(o=>{const os=actx.createOscillator(),g=actx.createGain();os.type='sine';os.frequency.value=660;g.gain.setValueAtTime(.0001,now+o);g.gain.exponentialRampToValueAtTime(.25,now+o+.02);g.gain.exponentialRampToValueAtTime(.0001,now+o+.28);os.connect(g).connect(actx.destination);os.start(now+o);os.stop(now+o+.3)})}catch(e){}}
setInterval(()=>{
  let changed=false;
  Object.values(S.timers).forEach(t=>{
    if(t.state==='running'){
      const rem=Math.ceil((t.endsAt-Date.now())/1000);
      if(rem<=0){t.state='done';t.remaining=0;changed=true;fireAlert(t)}
      else $$(`[data-timer-time="${t.id}"]`).forEach(e=>e.textContent=tfmt(rem));
    }
  });
  if(changed){save();renderDock();refreshTimerViews()}
},250);

/* ================= render & routing ================= */
const VIEWS={home:vHome,recipe:vRecipe,prep:vPrep,cook:vCook,done:vDone,settings:vSettings,saved:vSaved,timers:vTimers,system:vSystem};
let lastPage=null,focusFallback=null;
function render(o={}){
  const {page,id}=parse();
  const needsR=['recipe','prep','cook','done'].includes(page);
  const r=needsR?R(id):null;
  if(needsR&&!r){location.hash='#/';return}
  if(!VIEWS[page]){location.hash='#/';return}
  const prevKey=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  const y=window.scrollY;
  document.body.classList.toggle('cooking',page==='cook');
  document.title=(r?r.title+' · ':{home:'',settings:'Settings · ',saved:'Saved · ',timers:'Timers · ',system:'Design system · '}[page]||'')+'MindFlow';
  const body=VIEWS[page](r);
  if(page==='cook')$('#app').innerHTML=body;
  else $('#app').innerHTML=header(page)+`<main id="main" tabindex="-1">${body}</main>`;
  const changed=page+':'+(id||'')!==lastPage;
  lastPage=page+':'+(id||'');
  if(changed&&!o.keepScroll){window.scrollTo(0,0);const h=$('#app h1');if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true})}}
  else{
    window.scrollTo(0,y);
    let t=prevKey&&$(`[data-key="${CSS.escape(prevKey)}"]`);
    if(!t&&focusFallback)t=$(`[data-key="${CSS.escape(focusFallback)}"]`);
    if(t)t.focus({preventScroll:true});
  }
  focusFallback=null;
  const bar=$('.actionbar');document.body.style.setProperty('--dock-bottom',bar?(bar.offsetHeight+16)+'px':'16px');
}

function setStep(r,k){const ses=S.session;ses.step=Math.max(0,Math.min(r.steps.length-1,k));ses.showResume=false;save();render({keepScroll:true});window.scrollTo(0,0);const h=$('#stepH');if(h)h.focus({preventScroll:true});announce(`Step ${ses.step+1} of ${r.steps.length}`)}

  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,{page,id}=parse(),r=id?R(id):null;
  if(el.matches('input'))return;
  switch(act){
    case 'menu':menuOpen=!menuOpen;render({keepScroll:true});break;
    case 'toggleSave':{const rid=el.dataset.id;const k=S.saved.indexOf(rid);if(k>=0)S.saved.splice(k,1);else S.saved.push(rid);save();announce(k>=0?'Removed from saved':'Saved');focusFallback='save:'+rid;render({keepScroll:true});break}

    case 'units':S.prefs.units=el.dataset.v;save();render({keepScroll:true});break;

    case 'resume':if(S.session){S.session.showResume=true;save()}break;
    case 'prev':setStep(r,S.session.step-1);break;

      else setStep(r,ses.step+1);break}
    case 'goto':dlg().close();setStep(r,parseInt(el.dataset.step));break;

    case 'closeDlg':dlg().close();break;

    case 'tStart':tStart(el.dataset.rid,el.dataset.step,el.dataset.label,parseInt(el.dataset.secs));announce(`${el.dataset.label} timer started`);renderDock();render({keepScroll:true});break;

    case 'cookAgain':{const rid=el.dataset.id;S.checked[rid]={};Object.keys(S.timers).forEach(k=>{if(S.timers[k].rid===rid)delete S.timers[k]});startSession(rid);renderDock();location.hash='#/prep/'+rid;break}
    case 'feedback':S.feedback[id]=el.dataset.v;save();focusFallback='feedback:'+el.dataset.v;render({keepScroll:true});break;
    case 'pref':{const k=el.dataset.pref;S.prefs[k]=!S.prefs[k];save();applyPrefs();announce(`${k} ${S.prefs[k]?'on':'off'}`);render({keepScroll:true});break}
    case 'textSize':case 'font':case 'contrast':S.prefs[act]=el.dataset.v;save();applyPrefs();render({keepScroll:true});break;
    case 'testAlert':fireAlert({rid:'demo',label:'Test alert',step:0});break;
  }
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.act!=='check')return;
  const {id,k}=el.dataset;chk(id)[k]=el.checked;save();
  const r=R(id),{d,n}=pctReady(r);
  announce(`${el.checked?'Marked ready':'Moved back'}. ${d} of ${n} ready.`);
  if(parse().page==='prep'&&el.checked)focusFallback='ready:'+k[0];
  render({keepScroll:true});
});
document.addEventListener('toggle',e=>{const el=e.target;if(el.matches&&el.matches('details.ready')){prepOpen[el.dataset.ready]=el.open}},true);
document.addEventListener('input',e=>{if(e.target.id==='q'){homeQ=e.target.value;updateResults()}});
document.addEventListener('submit',e=>{if(e.target.dataset.form==='search'){e.preventDefault();updateResults()}});
function updateResults(){const rs=$('#results');if(!rs)return;rs.innerHTML=resultsHTML();const n=RECIPES.filter(matches).length;announce(`${n} ${n===1?'recipe':'recipes'} found`)}
function voice(){
  const st=$('#voice-status'),SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){st.textContent='Voice search isn’t available in this browser. You can type your search instead.';return}
  try{const rec=new SR();rec.lang='en-US';rec.interimResults=false;st.textContent='Listening…';
    rec.onresult=ev=>{homeQ=ev.results[0][0].transcript;$('#q').value=homeQ;st.textContent=`Heard: “${homeQ}”`;updateResults()};
    rec.onerror=()=>{st.textContent='Couldn’t hear that. Try again or type your search.'};rec.onend=()=>{if(st.textContent==='Listening…')st.textContent=''};rec.start()
  }catch(err){st.textContent='Voice search couldn’t start. You can type instead.'}
}

/* ================= boot ================= */
applyPrefs();
if(!location.hash)location.hash='#/';
render();renderDock();
</script>
</body>
</html>
