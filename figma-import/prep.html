0.10)}

:root{
  --bg:var(--color-background-primary);--bg2:var(--color-background-secondary);

*{box-sizing:border-box}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;min-width:48px;padding:0 24px;border-radius:var(--r-m);border:2px solid transparent;font-size:1.0625rem;font-weight:600;cursor:pointer;text-decoration:none;line-height:1.2;text-align:center;transition:background-color .12s,border-color .12s}
.btn-primary{background:var(--brand);color:var(--on-brand)}

.btn-primary:active,.btn-primary.is-pressed{background:var(--brand-p)}
.btn-secondary{background:var(--surface);color:var(--brand);border-color:var(--brand)}
.btn-secondary:hover,.btn-secondary.is-hover{background:var(--hover)}

.btn-quiet{background:transparent;color:var(--text);padding:0 16px;min-height:48px}
.btn-quiet:hover{background:var(--hover)}
.btn-icon{padding:0;width:48px;height:48px;min-height:48px}

.dots{display:inline-flex;gap:4px}.dots i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:blink 1s infinite}.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.btn-block{width:100%}

/* ---------- header ---------- */
.site-header{background:var(--bg);border-bottom:1px solid var(--border)}
.site-header .wrap{display:flex;align-items:center;justify-content:space-between;min-height:72px;gap:16px}
.logo{display:inline-flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:700;font-size:1.25rem;min-height:48px}

.nav-desktop{display:none;gap:8px;align-items:center}

.menu-btn{display:inline-flex}
.mobile-menu{border-top:1px solid var(--border);background:var(--surface)}
.mobile-menu .wrap{display:grid;gap:4px;padding-top:8px;padding-bottom:12px;min-height:0}

/* ---------- search & chips ---------- */
.hero{padding:40px 0 24px}
.hero .lead{margin-top:12px}
.search{display:flex;gap:8px;margin-top:24px;max-width:720px}
.search .field{position:relative;flex:1}
.search .field .ic{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--text2);pointer-events:none}

.search .btn-icon:hover{background:var(--hover)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:0 16px;border-radius:999px;border:2px solid var(--border-s);background:var(--surface);cursor:pointer;font-weight:500}
.chip .ic{width:18px;height:18px;display:none}
.chip:hover{background:var(--hover)}
.chip[aria-pressed=true]{background:var(--sel);border-color:var(--brand);font-weight:600}
.chip[aria-pressed=true] .ic{display:block}
.voice-status{min-height:24px;margin-top:8px}

/* ---------- cards ---------- */
.continue{display:flex;flex-direction:column;gap:16px;background:var(--surface);border:2px solid var(--brand);border-radius:var(--r-m);padding:16px;margin-top:24px}
.continue .meta{display:grid;gap:8px;flex:1}

.grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rcard{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow-low);transition:box-shadow .2s}
.rcard:hover,.rcard.is-hover{box-shadow:var(--shadow-medium)}
.rcard:has(a:focus-visible),.rcard.is-focus{outline:3px solid var(--focus);outline-offset:2px}
.rcard a:focus-visible{outline:none;box-shadow:none}
.rcard .thumb svg{display:block;width:100%;height:auto}
.rcard .body{padding:16px;display:grid;gap:8px;flex:1}
.rcard h3 a{color:var(--text);text-decoration:none}
.rcard h3 a::after{content:'';position:absolute;inset:0}
.rcard .save{position:absolute;top:8px;right:8px;z-index:2;display:inline-flex;align-items:center;gap:6px;min-height:48px;min-width:48px;padding:0 12px;border-radius:var(--r-m);border:2px solid var(--border-s);background:var(--surface);cursor:pointer;font-weight:600;font-size:.875rem;justify-content:center}

.rcard .save[aria-pressed=true]{border-color:var(--brand);background:var(--sel)}

.facts-row{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--text2);font-size:.875rem;font-weight:500}

.facts-row .ic{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:999px;background:var(--bg2);border:1px solid var(--border-s);font-size:.8125rem;font-weight:600;color:var(--text)}
.pill .ic{width:16px;height:16px}
.featured{display:grid;gap:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);overflow:hidden;position:relative;margin-top:40px}
.featured .thumb svg{display:block;width:100%;height:100%;object-fit:cover}
.featured .body{padding:24px;display:grid;gap:12px;align-content:center}
.featured h2 a{color:var(--text);text-decoration:none}
.featured h2 a::after{content:'';position:absolute;inset:0}
.featured:has(a:focus-visible){outline:3px solid var(--focus);outline-offset:2px}
.featured a:focus-visible{outline:none;box-shadow:none}
@media (min-width:600px){.featured{grid-template-columns:1fr 1fr}.featured .body{padding:32px}}
.section{margin-top:48px}
.section>.h2{margin-bottom:16px}
.empty{background:var(--surface);border:2px dashed var(--border-s);border-radius:var(--r-m);padding:32px 24px;text-align:center;display:grid;gap:12px;justify-items:center}

/* ---------- recipe overview ---------- */
.crumb{padding:16px 0 0}
.split{display:grid;gap:32px;padding-top:16px}

@media (min-width:600px) and (max-width:1024px){.split .summary .hero-img{max-width:640px}}
.hero-img{border-radius:var(--r-m);overflow:hidden;border:1px solid var(--border)}

.facts dt{font-size:.8125rem;font-weight:500;color:var(--text2)}
.facts dd{margin:0;font-size:1.25rem;font-weight:600}
.ctas{display:grid;gap:12px}
.controls{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:flex-end}

.seg{display:inline-flex;border:2px solid var(--border-s);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.seg button{min-height:48px;min-width:56px;padding:0 16px;border:0;background:transparent;cursor:pointer;font-weight:500;border-right:2px solid var(--border-s)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--hover)}
.seg button[aria-pressed=true]{background:var(--brand);color:var(--on-brand);font-weight:600}
.seg button:focus-visible{outline-offset:-3px}
.checklist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);cursor:pointer;position:relative}
.row input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.row .box{width:28px;height:28px;border:2px solid var(--border-s);border-radius:var(--r-s);display:grid;place-items:center;flex:none;background:var(--surface)}
.row .box .ic{width:20px;height:20px;color:var(--on-brand);opacity:0}
.row:hover,.row.is-hover{background:var(--hover)}
.row:has(input:focus-visible),.row.is-focus{outline:3px solid var(--focus);outline-offset:2px}
.row input:focus-visible{outline:none}
.row:has(input:checked) .box,.row.is-checked .box{background:var(--brand);border-color:var(--brand)}
.row:has(input:checked) .box .ic,.row.is-checked .box .ic{opacity:1}
.row:has(input:checked),.row.is-checked{background:var(--done)}
.row:has(input:checked) .name,.row.is-checked .name{text-decoration:line-through;color:var(--text2)}
.row .qty{font-weight:600;min-width:5.5ch;font-variant-numeric:tabular-nums}
.row .eq{color:var(--text2)}
.row .eq .ic{width:24px;height:24px}
.row .state{margin-left:auto;font-size:.8125rem;font-weight:600;color:var(--text2);display:none;align-items:center;gap:4px}
.row:has(input:checked) .state,.row.is-checked .state{display:inline-flex}
.row .state .ic{width:16px;height:16px}
details.ready{margin-top:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-m)}
details.ready>summary{min-height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;cursor:pointer;font-weight:600;list-style:none}
details.ready>summary::-webkit-details-marker{display:none}
details.ready>summary::after{content:'+';margin-left:auto;font-size:1.5rem;font-weight:500}
details.ready[open]>summary::after{content:'\2212'}
details.ready .checklist{padding:0 12px 12px}
details.disclose{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m)}
details.disclose>summary{min-height:56px;display:flex;align-items:center;padding:0 16px;cursor:pointer;font-weight:600;list-style:none;gap:8px}
details.disclose>summary::-webkit-details-marker{display:none}
details.disclose>summary::after{content:'+';margin-left:auto;font-size:1.5rem;font-weight:500}
details.disclose[open]>summary::after{content:'\2212'}
details.disclose>.in{padding:0 16px 16px}
details.disclose ol{margin:0;padding-left:24px;display:grid;gap:12px;max-width:65ch}

/* ---------- switch ---------- */
.switch{display:inline-flex;align-items:center;gap:12px;min-height:48px;background:none;border:0;padding:0;cursor:pointer;font-weight:600}
.switch .track{width:56px;height:32px;border-radius:999px;background:var(--border-s);position:relative;flex:none;transition:background-color .12s;border:2px solid var(--border-s)}
.switch .track::after{content:'';position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .12s;box-shadow:var(--shadow-low)}
.switch[aria-checked=true] .track{background:var(--brand);border-color:var(--brand)}
.switch[aria-checked=true] .track::after{transform:translateX(24px)}
.switch .txt{min-width:2.5ch}
.switch:disabled{cursor:not-allowed;color:var(--dis)}
.switch:disabled .track{background:var(--color-surface-disabled);border-color:var(--border)}
.switch.is-focus{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px #fff;border-radius:var(--r-s)}
.switch-row{display:flex;gap:16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:12px 16px}

/* ---------- progress ---------- */
.progress{display:grid;gap:8px}
.progress .bar{height:12px;background:var(--subtle);border-radius:999px;overflow:hidden;border:1px solid var(--border-s)}
.progress .bar>i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .2s}
.progress.is-complete .bar>i{background:var(--color-feedback-success)}
.progress .cap{display:flex;justify-content:space-between;font-weight:600;font-size:.9375rem;align-items:center;gap:8px}
.progress .cap .ic{width:18px;height:18px}
.segs{display:flex;gap:6px}
.segs i{flex:1;height:12px;border-radius:999px;background:var(--subtle);border:1px solid var(--border-s)}
.segs i.d{background:var(--brand);border-color:var(--brand)}
.segs i.c{background:var(--surface);border:3px solid var(--brand)}

/* ---------- prep ---------- */
.narrow{max-width:720px;margin:0 auto}
.prep-head{padding:32px 0 16px}
.cols{display:grid;gap:32px}
@media (min-width:1025px){.cols.two{grid-template-columns:1fr 1fr}}
.sticky-cta{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 75%,transparent);padding:16px 0 calc(16px + env(safe-area-inset-bottom));margin-top:32px;display:grid;gap:12px;z-index:5}

/* ---------- cook ---------- */
body.cooking{--bar-h:81px}
.focus-head{background:var(--bg);border-bottom:1px solid var(--border)}
.focus-head .wrap{display:flex;align-items:center;gap:8px;min-height:64px}
.focus-head .t{flex:1;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cook-layout{display:grid;gap:24px;padding-top:24px}
@media (min-width:600px){.cook-layout{grid-template-columns:minmax(0,1fr) 300px;align-items:start}}
@media (min-width:1025px){.cook-layout{grid-template-columns:minmax(0,1fr) 340px;gap:32px}}
.stepcard{background:var(--surface);border:2px solid var(--border);border-radius:var(--r-m);padding:24px;display:grid;gap:20px;box-shadow:var(--shadow-medium)}
@media (min-width:600px){.stepcard{padding:40px}}
.stepcard.is-done{background:var(--done)}
.stepcard .step-title{font-size:1rem;font-weight:700;color:var(--text2);letter-spacing:.04em;text-transform:uppercase;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.instruction{font-size:clamp(1.25rem,2.2vw,1.625rem);line-height:1.6;font-weight:500;max-width:65ch}
.badge{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:0 12px;border-radius:999px;font-size:.8125rem;font-weight:700;letter-spacing:.02em;text-transform:none;background:var(--color-feedback-successSurface);color:var(--color-feedback-success);border:1px solid var(--color-feedback-success)}
.badge .ic{width:16px;height:16px}
.note{display:flex;gap:12px;padding:16px;border-radius:var(--r-m);border:2px solid}
.note.warn{background:var(--color-feedback-warningSurface);border-color:var(--color-feedback-warning);color:var(--color-feedback-warningText)}
.note.info{background:var(--color-feedback-infoSurface);border-color:var(--color-feedback-info);color:#25434d}
.note .ic{margin-top:2px}
.note strong{display:block}
.side{display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-m);padding:16px;display:grid;gap:12px}
.panel h2{font-size:1rem;font-weight:700;display:flex;gap:8px;align-items:center}

.panel li .q{font-weight:600;min-width:6ch;font-variant-numeric:tabular-nums}

.panel .none{color:var(--text2);font-size:.9375rem}
.actionbar{position:sticky;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--border);padding:12px 0 calc(12px + env(safe-area-inset-bottom))}

.banner{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--color-feedback-infoSurface);border:2px solid var(--color-feedback-info);border-radius:var(--r-m);padding:12px 16px;color:#25434d}

/* ---------- timers ---------- */
.timer{--tc:var(--color-timer-running);--ts:var(--color-timer-runningSurface);border:2px solid var(--tc);background:var(--ts);border-radius:var(--r-m);padding:16px;display:grid;gap:12px;color:var(--text)}
.timer[data-state=paused]{--tc:var(--color-timer-paused);--ts:var(--color-timer-pausedSurface)}
.timer[data-state=done]{--tc:var(--color-timer-expired);--ts:var(--color-timer-expiredSurface);color:var(--color-feedback-warningText)}
.timer[data-state=dismissed]{--tc:var(--border-s);--ts:var(--surface)}
.timer .status{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--tc);font-size:.9375rem}
.timer[data-state=done] .status{color:var(--color-feedback-warningText)}
.timer .digits{font-size:2.5rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--text)}
.timer[data-state=done] .digits{color:var(--color-feedback-warningText)}
.timer .tlabel{font-weight:500;color:var(--text2)}
.timer[data-state=done] .tlabel{color:var(--color-feedback-warningText)}
.timer .tctl{display:flex;gap:8px;flex-wrap:wrap}
.timer .tctl .btn{flex:1;min-width:120px}
.timer[data-state=done]{animation:soft 1.6s ease-in-out 3}

.timer-idle{width:100%}
.dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-bottom) + env(safe-area-inset-bottom));width:min(560px,calc(100% - 24px));z-index:40;display:grid;gap:8px;max-height:45vh;overflow:auto}

.dock .dockitem .btn{min-height:48px;padding:0 14px;font-size:.9375rem}
.dock.pulse .dockitem[data-state=done]{animation:soft 1.6s ease-in-out 3}
.demo-row{display:grid;gap:16px}

.done-actions{display:grid;gap:12px;width:100%;max-width:420px}
.fb{display:grid;gap:8px;justify-items:center}

.set-group{display:grid;gap:12px}

/* ---------- dialog ---------- */
dialog{border:0;border-radius:var(--r-m);padding:0;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 48px);background:var(--surface);color:var(--text);box-shadow:var(--shadow-high)}

.sw b{display:block;font-size:.8125rem}
.spec{display:grid;gap:12px;align-items:start}
.spec-row{display:grid;gap:12px}

.sbar{display:flex;align-items:center;gap:12px;font-size:.875rem}

footer.site-footer{border-top:1px solid var(--border);padding:24px 0 calc(var(--bar-h) + 24px);color:var(--text2);font-size:.875rem;margin-top:48px}
